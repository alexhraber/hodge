name: Verify arithmetic
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: node src/cli.mjs > /tmp/fermat-fourfolds.csv && diff -u data/fermat-fourfolds.csv /tmp/fermat-fourfolds.csv
